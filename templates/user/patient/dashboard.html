{% extends 'user/patient/base.html' %}


{% block content %}
<style>
    td{
        height:50px;
        align-content: center;
        justify-content: center;
        align-items: center;
    }
</style>

<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Dashboard</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group me-2 d-none">
            <button type="button" class="btn btn-sm btn-outline-secondary">Share</button>
            <button type="button" class="btn btn-sm btn-outline-secondary">Export</button>
        </div>
        <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1">
            <svg class="bi" aria-hidden="true"><use xlink:href="#calendar3"></use></svg>
            This week
        </button>
    </div>
</div>

<div class="container">
    <div class="d-flex gap-2 justify-content-between">
        <div class="col-md-3">
            <div class="card overflow-hidden" style="height: 100px; width:100px;">
            </div>
        </div>
        <div class="col-md-3">
            <div class="card overflow-hidden" style="height: 100px; width:100px;">
            </div>
        </div>
        <div class="col-md-3">
            <div class="card overflow-hidden" style="height: 100px; width:100px;">
            </div>
        </div>
        <div class="col-md-3">
            <div class="card overflow-hidden" style="height: 100px; width:100px;">
            </div>
        </div>
    </div>
</div>

<hr class="hr"/>

<canvas class="my-4 w-100" id="myChart" width="1077" height="455" style="display: block; box-sizing: border-box; height: 455px; width: 1077px;"></canvas>

<hr class="hr"/>

<div class="table-responsive small mt-5">
    <h2 class="my-4">Appointment Bookings</h2>
    <table class="table table-striped table-sm">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Date</th>
                <th scope="col">Subject</th>
                <th scope="col">Consultant</th>
                <th scope="col">Status</th>
            </tr>
        </thead>
        <tbody>
            
            {% for i in '1234' %}                
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>placeholder</td>
                <td>irrelevant</td>
                <td>visual</td>
                <td>layout</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
