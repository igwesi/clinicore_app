{% load static %}
<div class="sidebar sidebar-hide-to-small sidebar-shrink sidebar-gestures position-fixed">
            <div class="nano">
                <div class="nano-content">
                    <ul>
                        <div class="logo bg-light">
                            <a href="{% url 'dashboard' %}">
                                <span>
                                    <img width="120px" src="{% static 'clinicore.png' %}" alt="clinicore"/>
                                    Care
                                </span>
                            </a>
                        </div>
                        <li class="label">Main</li>
                        <li {% if request.path == '/dashboard/' %} class="active" {% endif %}>
                            <a href="{% url 'dashboard' %}">
                                <i class="ti-home"></i> 
                                Dashboard 
                            </a>
                        </li>

                        <li class="label">Apps</li>
                        <li {% if request.path == '/clinic/patients/' %}class="active"{% endif %}>
                            <a href="{% url 'patients' %}"><i class="ti-user"></i> Patients</a>
                        </li>
                        <li {% if request.path == '/clinic/drug/list/' %} class="active" {% endif %}>
                            <a href="{% url 'list-drugs' %}">
                                <i class="ti-layout-grid2-alt"></i> 
                                Drugs 
                            </a>
                        </li>
                        <li><a href="#"><i class="ti-file"></i> Records</a></li>
                        <li class="{% if request.path == '/clinic/appointment/' %}active{% endif %}">
                            <a href="#app-event-calender.html"><i class="ti-calendar"></i> Appointment </a>
                        </li>
                        <li>
                            <a class="sidebar-sub-toggle">
                                <i class="ti-target"></i> 
                                Settings 
                                <span class="sidebar-collapse-icon ti-angle-down"></span>
                            </a>
                            <ul>
                                <li><a href="#"><i class="ti-user"></i>Profile</a></li>
                                <li><a href="{% url 'logout' %}"><i class="ti-close"></i> Logout</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
