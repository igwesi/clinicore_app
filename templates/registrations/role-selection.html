{% extends "registrations/base.html" %}
{% load static %}
{% load bootstrap5 %}

{# Display django.contrib.messages as Bootstrap alerts #}
{% bootstrap_messages %}
{% block title %} - Account Role {% endblock %}

{% block content %}
<div class="container">
    <div class="row d-flex justify-content-center">
        
        <div class="col-10 col-md-4 bg-light p-2 rounded-md-start">
            <div class="h-100 d-flex justify-content-center align-items-center">
                <img width="30%" src="{% static 'images/aui-logo.png' %}" alt="Augustine University Logo" class="img-fluid"/>
            </div>
        </div>

        <div class="col-10 col-md-4 bg-light p-2 rounded-md-end">
            <form method="POST" class="h-100 d-flex flex-column justify-content-center align-items-center">{% csrf_token %}
                <div class="d-flex flex-column justify-content-center align-items-center mb-3">
                    <label for="auth-role-field" class="form-label login-account-text">Choose Account Role</label>
                    <p class="badge bg-secondary p-2"><small>Note: This can only be set once</small></p>
                    <select
                        class="form-select form-select-md w-75"
                        name="auth-role"
                        id="auth-role">
                        <option selected>Select Role</option>
                        <option value="staff">Staff</option>
                        <option value="patient">Patient</option>
                    </select>
                </div>
                <button
                    type="submit"
                    class="btn btn-danger w-50">
                    Next
                </button>
            </form>
        </div>

    </div>
</div>  
{% endblock %}
