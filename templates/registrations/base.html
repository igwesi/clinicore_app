{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-100">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Clinicore  {% block title %}{% endblock %}</title>
        <!-- Favicon icon -->
        <!-- Standard -->
        <link rel="shortcut icon" href="{% static 'favicon/apple-touch-icon.png' %}">
        <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
        <!-- Retina iPad Touch Icon-->
        <link rel="apple-touch-icon" sizes="144x144" href="{% static 'favicon/apple-touch-icon.png' %}">
        <!-- Retina iPhone Touch Icon-->
        <link rel="apple-touch-icon" sizes="114x114" href="{% static 'favicon/apple-touch-icon.png' %}">
        <!-- Standard iPad Touch Icon-->
        <link rel="apple-touch-icon" sizes="72x72" href="{% static 'favicon/apple-touch-icon.png' %}">
        <!-- Standard iPhone Touch Icon-->
        <link rel="apple-touch-icon" sizes="57x57" href="{% static 'favicon/apple-touch-icon.png' %}">
        <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">        
        <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
        <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
        <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
        
        <link href="{% static 'core/css/lib/bootstrap.min.css' %}" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
            crossorigin="anonymous"/>
        <link href="{% static 'core/css/style.css' %}" rel="stylesheet">
        <style>
            .authentication-content {
                background: #fff;
                box-shadow: 0 0 35px 0 rgba(154, 161, 171, 0.15);
                border-radius: 5px;
            }
            .auth-form {
                padding: 80px 100px;
            }
            .auth-form .btn {
                height: 50px;
                font-weight: 700;
            }
            .form-control {
                display: block;
                width: 100%;
                height: calc(1.5em 21px + 0.75rem + 2px);
                padding: 0.375rem 0.75rem;
                font-size: 0.875rem;
                font-weight: 400;
                line-height: 1.5;
                color: #495057;
                background-color: #fff;
                background-clip: padding-box;
                border: 1px solid #eaeaea;
                border-radius: 0.25rem;
                transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            }
            .form-check {
                position: relative;
                display: block;
                padding-left: 1.25rem;
            }
            .brand-container{
                display:flex;
                flex-direction:column;
                justify-content: center;
                align-content: center;
                align-items: center;
                text-align:center;
                object-fit: contain;
                & img{
                    height: 50px;
                    object-fit: contain;
                }
                & .text{
                    margin-top: -20px;
                }
            }
            .figure{
                height:400px
                overflow:hidden;
                object-fit: contain;
            }
            img{
                height: 100%;
            }
            label[for='id_captcha_1']{
                padding: 10px 22px;
                font-size: 1em;
                color: #495057 !important;
                opacity: 0.3;
                font-weight: bold;
                text-align: start;
            }
            #id_captcha_1{
                color:red !important;
            }
            input#id_captcha_1{
                display: inline-flex;
                width: calc(100%/1.3);
                margin-top: 10px;
                margin-bottom: 10px;
            }
            .captcha{
                width:20%;
            }
        </style>
    </head>
    <body class="h-100">
        <div class="authentication">
            <div class="container-fluid">
                {% block content %}{% endblock %}
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
            crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"
            integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5/6/2Q4d4e5f5a5f5a5f5a5f5a5f5a5f5a5f5a"
            crossorigin="anonymous"></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
