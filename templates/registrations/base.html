{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-100">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Clinicore  {% block title %}{% endblock %}</title>
        <!-- Favicon icon -->
        <link rel="shortcut icon" href="{% static 'favicon/apple-touch-icon.png' %}">
        <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
        <!-- Retina iPad Touch Icon-->
        <link rel="apple-touch-icon" sizes="144x144" href="{% static 'favicon/apple-touch-icon.png' %}">
        <!-- Retina iPhone Touch Icon-->
        <link rel="apple-touch-icon" sizes="114x114" href="{% static 'favicon/apple-touch-icon.png' %}">
        <!-- Standard iPad Touch Icon-->
        <link rel="apple-touch-icon" sizes="72x72" href="{% static 'favicon/apple-touch-icon.png' %}">
        <!-- Standard iPhone Touch Icon-->
        <link rel="apple-touch-icon" sizes="57x57" href="{% static 'favicon/apple-touch-icon.png' %}">
        <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">        
        <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
        <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
        <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
            crossorigin="anonymous"/>
        <link href="{% static 'core/css/style.css' %}" rel="stylesheet">

        <style>
            body{
                display: flex;
                height: 100vh;
                align-items: center;
                flex-direction: column;
                justify-content: center;
                background-repeat: no-repeat;
                background-size: cover;
                background-image: url("{% static 'images/frontview.jpg' %}");
                background-position: center;
                background-attachment: fixed;
            }
            .auth-form .btn {
                padding: 10px;
                font-weight: 700;
            }
            .form-control {
                width: 100%;
                color: #495057;
                display: block;
                font-weight: 400;
                line-height: 1.5;
                font-size: 0.875em;
                border-radius: 0.25em;
                background-color: #fff;
                padding: 0.375em 0.75em;
                background-clip: padding-box;
                border: 1px solid #eaeaea;
                transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            }
            label[for='id_captcha_1']{
                padding: 10px 22px;
                font-size: 1em;
                color: #495057 !important;
                opacity: 0.3;
                font-weight: bold;
                text-align: start;
            }
            #id_captcha_1{
                display: flex;
                width: 100% !important;
                position: relative;
            }
            input#id_captcha_1{
                display: inline-flex;
                width: calc(100%/1.3);
                margin-top: 10px;
                margin-bottom: 10px;
            }
            .captcha{
                width:20%;
            }
            .brand-container{
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 2px;
            } 
            .login-account-text{
                color: #936251; 
                font-weight: bold; 
                font-size: 20px;
            }
            .login-account-btn{}
            .create-account-btn{
                width:100%; 
                background:#761404; 
                border-color:#550700;
            }
            .create-account-text{
                color: #761404;
                font-size: 18px;
                align-content: center;
                border-bottom: 1px dotted red;
                font-weight: bold;
            }
            .create-account-btn:hover{
                transition: all ease-in-out .5s;
                background:#430c03; 
            }
            @media (width <= 740px){
                .brand-container{
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    gap: 2px;
                } 
            }
        </style>
    </head>
    <body>
        {% block content %}{% endblock %}

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
            crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"
            integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5/6/2Q4d4e5f5a5f5a5f5a5f5a5f5a5f5a5f5a"
            crossorigin="anonymous"></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
